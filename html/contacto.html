        <!--Barra de navegación-->
        <nav class="navbar navbar-expand-lg bg-body-tertiary" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Photoland</a>

            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">

        <!--Header-->
        <header class="container-fluid p-4 bg-warning"><h5>Contacto<span class="badge text-bg-primary ms-1">Formulario inactivo</span></h5></header>

        <!--Formulario de contacto-->
        <div class="container-lg mt-5 mb-5">
            <div class="row row-cols-1 row-cols-sm-2 row-cols-md-2 row-cols-lg-2  row-cols-xl-2 d-flex justify-content-center mt-2">
                <form>

                <div class="mb-3">
                <label for="exampleFormControlInput1" class="form-label">Nombre</label>
                <input type="name" class="form-control" id="exampleFormControlInput1" placeholder="Tu nombre">
                </div>
                <div class="mb-3">
                <label for="exampleFormControlInput2" class="form-label">Tel</label>
                <input type="tel" class="form-control" id="exampleFormControlInput2" placeholder="+34 000 00 00 00">
                </div>                
                <div class="mb-3">
                <label for="exampleFormControlInput3" class="form-label">Email</label>
                <input type="email" class="form-control" id="exampleFormControlInput3" placeholder="name@example.com">
                </div>
                <div class="mb-3">
                <label for="exampleFormControlTextarea1" class="form-label">Mensaje</label>
                <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
                </div>

                <button type="submit" class="btn btn-primary">Submit</button>
                </form>
            </div>
        </div>

        <!--Footer-->
        <footer class="container-fluid p-4 bg-warning text-center">
            <div class="row row-cols-3 me-2">
                <div class="d-flex justify-content-start">
                    <ol>
                        <li><i class="bi bi-1-circle-fill m-1"></i>Elemento</li>
                        <li><i class="bi bi-2-circle-fill m-1"></i>Elemento</li>
                        <li><i class="bi bi-3-circle-fill m-1"></i>Elemento</li>                                                
                    </ol>                                                         
                </div>
                <div class="d-flex justify-content-center">
                    <a><i class="bi bi-1-circle-fill m-1"></i>Elemento</a>
                </div>
                <div class="d-flex justify-content-end">
                    <ol>
                        <li>Elemento<i class="bi bi-1-circle-fill m-1"></i></li>
                        <li>Elemento<i class="bi bi-2-circle-fill m-1"></i></li>
                        <li>Elemento<i class="bi bi-3-circle-fill m-1"></i></li>                                                   
                    </ol>   
                </div>                                
            </div>
        </footer>        

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
