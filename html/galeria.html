<!DOCTYPE html>
<html>
    <head>
        <title>Bootstrap</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <body class="bg-body-tertiary">
        <!--Barra de navegación-->
        <nav class="navbar navbar-expand-lg bg-body-tertiary" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Photoland</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="../index.html">Inicio</a>
                </li>
                <li class="nav-item">
                <a class="nav-link" href="galeria.html">Galeria</a>
                </li>
                <li class="nav-item">
                <a class="nav-link" href="contacto.html">Contacto</a>
                </li>
            </ul>
            </div>
        </div>
        </nav>

        <!--Header-->
        <header class="container-fluid p-4 bg-warning"><h5>Galeria</h5></header>

        <!--Galeria sistema rejillas-->
        <div class="container-lg mt-5 mb-5">
            <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-5 d-flex justify-content-center">
                <img src="../img/Amarillo.png" class="img-fluid" alt="Amarillo">
                <img src="../img/Azul.png" class="img-fluid">
                <img src="../img/Morado.png" class="img-fluid">
                <img src="../img/Naranja.png" class="img-fluid">
                <img src="../img/Rojo.png" class="img-fluid">
                <img src="../img/Verde.png" class="img-fluid">                                                
            </div>
            <div class="row row-cols-1 row-cols-sm-1 row-cols-md-2 row-cols-lg-2 row-cols-xl-3 d-flex mt-5 mb-5 ms-1 me-1 justify-content-center">
                <div class="card">
                <div class="card-header">
                    Mis servicios
                </div>
                <div class="card-body">
                    <h5 class="card-title">Fotos artisticas</h5>
                    <p class="card-text">With supporting text below as a natural lead-in to additional content.</p>
                    <a href="#" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#exampleModal">Contacto</a>
                </div>
                </div>
            </div>          
        </div>

        <!--Footer-->
        <footer class="container-fluid p-4 bg-warning text-center"><h5>Footer</h5></footer>

        <!-- Modal Galeria -->
        <div class="modal fade" id="imgModal" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered modal-lg">
                <div class="modal-content bg-dark">

                    <div class="modal-body text-center">
                        <img id="modalImg" class="img-fluid">
                    </div>

                </div>
            </div>
        </div>

        <!-- Modal Card -->
        <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="exampleModalLabel">Contacto</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form>

                <div class="mb-3">
                <label for="exampleFormControlInput1" class="form-label">Nombre</label>
                <input type="name" class="form-control" id="exampleFormControlInput1" placeholder="Tu nombre">
                </div>
                <div class="mb-3">
                <label for="exampleFormControlInput2" class="form-label">Tel</label>
                <input type="tel" class="form-control" id="exampleFormControlInput2" placeholder="+34 000 00 00 00">
                </div>                
                <div class="mb-3">
                <label for="exampleFormControlInput3" class="form-label">Email</label>
                <input type="email" class="form-control" id="exampleFormControlInput3" placeholder="name@example.com">
                </div>
                <div class="mb-3">
                <label for="exampleFormControlTextarea1" class="form-label">Mensaje</label>
                <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
                </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="submit" class="btn btn-primary">Submit</button>
            </div>
            </div>
        </div>
        </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>
        const images = document.querySelectorAll(".row img");
        const modalImg = document.getElementById("modalImg");
        const imgModal = new bootstrap.Modal(document.getElementById("imgModal"));
        images.forEach(img => {

            img.style.cursor = "pointer";

            img.addEventListener("click", () => {

                modalImg.src = img.src;
                imgModal.show();

            });

        });

        const myModal = document.getElementById('exampleModal')
        const myInput = document.getElementById('myInput')

        myModal.addEventListener('shown.bs.modal', () => {
        myInput.focus()
        })
    </script>
    </body>
</html>
